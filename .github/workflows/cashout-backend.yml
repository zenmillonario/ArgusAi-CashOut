name: CashOutAI backend regression checks
'on':
  push:
    branches:
      - 'codex/cashoutai-event-notices-*'
    paths:
      - 'backend/**'
      - '.github/workflows/cashout-backend.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies at repository pins
        run: |
          python -m pip install --no-input --only-binary=:all: --constraint backend/requirements.txt aiohttp bcrypt fastapi httpx limits motor pydantic pymongo python-dotenv python-multipart requests resend slowapi starlette pytest uvicorn h11 websockets
          python -m pip check
      - name: Run synthetic backend unit suites
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
