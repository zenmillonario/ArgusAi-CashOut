name: CashOutAI synthetic recovery and browser checks

# This checks the reviewed release branch using wholly synthetic accounts.
# It never connects to Atlas, deploys the app, or verifies a production backup.
'on':
  push:
    branches:
      - codex/cashoutai-square-launch-2026-11-25
    paths:
      - .github/workflows/cashout-recovery-rehearsal.yml
      - backend/**
      - frontend/**
      - scripts/test_recovery_browser.py

permissions:
  contents: read

concurrency:
  group: cashout-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-recovery:
    name: Real MongoDB and compiled frontend, synthetic accounts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_CONFIG_FILE: /dev/null
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the private rehearsal directory
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/cashout-recovery"
          printf 'REHEARSAL_DIR=%s\n' "$RUNNER_TEMP/cashout-recovery" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$RUNNER_TEMP/cashout-recovery/browsers" >> "$GITHUB_ENV"

      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Install the required application dependencies at repository pins
        run: |
          umask 077
          mkdir -p "$REHEARSAL_DIR"
          python -m venv "$REHEARSAL_DIR/venv"
          "$REHEARSAL_DIR/venv/bin/python" -m pip install \
            --no-input --only-binary=:all: --index-url https://pypi.org/simple \
            --constraint backend/requirements.txt \
            aiohttp bcrypt fastapi httpx limits motor pydantic pymongo \
            python-dotenv python-multipart requests resend slowapi starlette \
            pytest playwright uvicorn h11 websockets
          "$REHEARSAL_DIR/venv/bin/python" -m pip check

      - name: Run the backend unit regression suites
        run: |
          # unittest discovers only TestCase suites. The older pytest-only
          # live-API test file must never be executed against any real account.
          "$REHEARSAL_DIR/venv/bin/python" -m unittest discover \
            -s backend/tests -p 'test_*.py'

      - name: Install the locked frontend and browser dependencies
        run: |
          npm install --global yarn@1.22.22 --ignore-scripts --no-audit --no-fund
          yarn --cwd frontend install --frozen-lockfile --non-interactive
          "$REHEARSAL_DIR/venv/bin/python" -m playwright install --with-deps chromium

      - name: Compile the exact frontend for the private same-origin preview
        env:
          REACT_APP_BACKEND_URL: ''
          PUBLIC_URL: ''
          GENERATE_SOURCEMAP: 'false'
          CI: 'true'
        run: yarn --cwd frontend build

      - name: Download and verify the official MongoDB 8.0.38 binary
        run: |
          umask 077
          curl --fail --silent --show-error --location --proto '=https' \
            --connect-timeout 15 --max-time 120 --retry 2 \
            --output "$REHEARSAL_DIR/mongodb.tgz" \
            https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.38.tgz
          printf '%s  %s\n' \
            '2885d4382bd47b96bfaf3edc7dec0ef44463e3e2a79479f584d20deb6182cda9' \
            "$REHEARSAL_DIR/mongodb.tgz" | sha256sum --check --status
          mkdir -p "$REHEARSAL_DIR/mongodb" "$REHEARSAL_DIR/db"
          tar --extract --gzip --file "$REHEARSAL_DIR/mongodb.tgz" \
            --directory "$REHEARSAL_DIR/mongodb" --strip-components=1 \
            --no-same-owner --no-same-permissions
          "$REHEARSAL_DIR/mongodb/bin/mongod" --version

      - name: Start an isolated standalone MongoDB
        run: |
          # This small fixture needs only the minimum WiredTiger cache.
          # There is no replica set, published service, Atlas URI, or cloud key.
          "$REHEARSAL_DIR/mongodb/bin/mongod" \
            --dbpath "$REHEARSAL_DIR/db" \
            --bind_ip 127.0.0.1 --port 27217 --nounixsocket \
            --wiredTigerCacheSizeGB 0.25 \
            --setParameter diagnosticDataCollectionEnabled=false \
            --logpath "$REHEARSAL_DIR/mongod.log" \
            --pidfilepath "$REHEARSAL_DIR/mongod.pid" --fork
          "$REHEARSAL_DIR/venv/bin/python" - <<'PY'
          from pymongo import MongoClient
          with MongoClient("mongodb://127.0.0.1:27217/?directConnection=true",
                           serverSelectionTimeoutMS=5000) as client:
              hello = client.admin.command("hello")
              version = client.admin.command("buildInfo")["version"]
              assert version == "8.0.38"
              assert "setName" not in hello and hello.get("msg") != "isdbgrid"
              print({"mongo_version": version, "standalone": True, "synthetic_only": True})
          PY

      - name: Check refusal and browser boundaries
        run: |
          "$REHEARSAL_DIR/venv/bin/python" \
            backend/tests/rehearse_restored_app_recovery.py --self-test

      - name: Exercise the actual app against real MongoDB with synthetic accounts
        run: |
          "$REHEARSAL_DIR/venv/bin/python" \
            backend/tests/rehearse_restored_app_recovery.py \
            --mode exercise --mongo-port 27217 \
            --database cashout_rehearsal_github_actions --seed-synthetic

      - name: Complete recovery and replace sessions through the compiled browser UI
        timeout-minutes: 5
        run: |
          umask 077
          "$REHEARSAL_DIR/venv/bin/python" scripts/test_recovery_browser.py \
            --frontend-build "$GITHUB_WORKSPACE/frontend/build" \
            --mongo-port 27217 --http-port 4185

      - name: Record the evidence boundary
        run: |
          printf '%s\n' \
            'The actual application recovery rehearsal passed on MongoDB 8.0.38 using wholly synthetic accounts.' \
            'The matching compiled frontend completed its captured reset link, rejected reuse, retained login after reload, and replaced the first browser session after a second sign-in.' \
            'This is synthetic browser evidence only. It does not verify restored member recovery, production deployment, real email delivery, or live providers.' \
            'No database files, captured reset links, operator details, or runtime logs are uploaded as artifacts.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the temporary MongoDB process
        if: always()
        run: |
          if [[ -n "${REHEARSAL_DIR:-}" && -x "$REHEARSAL_DIR/mongodb/bin/mongod" && -f "$REHEARSAL_DIR/mongod.pid" ]]; then
            "$REHEARSAL_DIR/mongodb/bin/mongod" --shutdown \
              --dbpath "$REHEARSAL_DIR/db" >/dev/null 2>&1 || true
          fi
          # The browser runner reaps its preview and removes its private state
          # in finally, including on SIGTERM. Runner-local Mongo data is also
          # removed; none of it is uploaded as an artifact.
          if [[ "${REHEARSAL_DIR:-}" == "$RUNNER_TEMP/cashout-recovery" ]]; then
            rm -rf -- "$REHEARSAL_DIR/db"
          fi
